[project]
name = "formulatech"
version = "0.1.0"
description = "Pre-race battery safety check: rule checks plus an XGBoost efficiency model"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formulatech"]

[tool.pytest.ini_options]
testpaths = ["tests"]
